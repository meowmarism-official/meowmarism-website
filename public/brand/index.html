<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<meta name="theme-color" content="#06090f">
<title>brand policy - meowmarism</title>
<meta name="description" content="Brand Policy for the meowmarism name and logo.">
<link rel="stylesheet" href="/assets/site.css">
<style>
  #doc{white-space:pre-wrap;color:var(--muted);font-size:13.5px;line-height:1.7;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Brand Policy</h1>
  <p class="updated">Loaded live from <a href="https://github.com/meowmarism-official/meowmarism-lite/blob/master/BRAND-POLICY.md" target="_blank" rel="noopener">BRAND-POLICY.md on GitHub</a>, always in sync with the repo.</p>

  <p class="updated" style="margin-top:-6px">Also: <a href="/license">Software License</a> · <a href="/website-license">Website License</a> · <a href="/brand">Brand Policy</a></p>
  <div id="doc"><p class="loading">Loading the brand policy from GitHub&hellip;</p></div>
</div>

<script src="/assets/header.js" defer></script>
<script>
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
fetch('https://raw.githubusercontent.com/meowmarism-official/meowmarism-lite/master/BRAND-POLICY.md')
  .then((r) => { if (!r.ok) throw new Error(`GitHub responded with ${r.status}`); return r.text(); })
  .then((text) => { document.getElementById('doc').textContent = text; })
  .catch((err) => {
    document.getElementById('doc').innerHTML = `<p class="error">Couldn't load the brand policy from GitHub (${escapeHtml(err.message)}). Read it directly on <a href="https://github.com/meowmarism-official/meowmarism-lite/blob/master/BRAND-POLICY.md" target="_blank" rel="noopener">GitHub</a> instead.</p>`;
  });
</script>
</body>
</html>
